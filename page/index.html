<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Turnstile</title>
</head>
<body>
  <div id="widget"></div>
  <script>
    window.__solved_token__ = null;

    window.onTurnstileLoad = () => {
      const widgetId = turnstile.render('#widget', {
        sitekey: '0x4AAAAAAAe7i7oicz-TnMTr',
        action: 'emailfinderlinkedin',
        execution: 'execute',
        callback: (token) => {
          window.__solved_token__ = token;
          document.getElementById('widget').setAttribute('data-token', token);
        }
      });
      turnstile.execute(widgetId);
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</body>
</html>
